org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# La compilación incremental de Kotlin falla en esta unidad al cerrar sus
# caches ("Could not close incremental caches ... class-fq-name-to-source.tab")
# y tumba el assembleRelease. Compilar desde cero tarda unos segundos más,
# pero no es aleatorio: un release tiene que salir siempre.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
